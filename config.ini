# 奥拉星立绘提取器 - URL配置
# {id} 会被替换为你输入的宠物ID
# URL规律已通过抓包确认，无需修改

[network]
# 资源根域名
base_url = https://aola.100bt.com/h5/

# 请求 Referer (部分资源需要正确的来源才能下载)
referer = https://aola.100bt.com/h5/

# 请求超时(秒)
timeout = 15

# 请求间隔(秒,避免请求过快被ban)
interval = 0.3

[static]
# 静态立绘 PNG (已抓包确认)
# frame=0: 250x250 小图标 (图鉴用)
# frame=1: ~1500x1400 大立绘 (完整立绘)
# 不需要版本号即可直接访问

# 小图标 (frame=0)
url_template = https://aola.100bt.com/h5/peticon/newlarge/type1/peticon{id}/peticon{id}_0.png

# 大立绘 (frame=1) - 这才是要的高清立绘
url_template_alt1 = https://aola.100bt.com/h5/peticon/newlarge/type1/peticon{id}/peticon{id}_1.png

# 备选(留空)
url_template_alt2 =

[spine]
# Spine 动态立绘 (已抓包确认)
# 目录: /h5/peticon/newbreath/petmovie{ID}/
# 格式: Spine 3.7.89, JSON格式骨骼数据(非.sk二进制)
# 三件套: .json(骨骼) + .atlas(图集描述) + .png(图集图片)
# 不需要版本号即可直接访问

# 动画数据文件 (JSON格式, Spine 3.7)
skeleton_url_template =
skeleton_json_url_template = https://aola.100bt.com/h5/peticon/newbreath/petmovie{id}/petmovie{id}.json

# 图集描述文件
atlas_url_template = https://aola.100bt.com/h5/peticon/newbreath/petmovie{id}/petmovie{id}.atlas

# 图集图片
texture_url_template = https://aola.100bt.com/h5/peticon/newbreath/petmovie{id}/petmovie{id}.png

[output]
# 下载的资源保存目录
download_dir = ./assets

# 导出的壁纸保存目录
wallpaper_dir = ./wallpapers
